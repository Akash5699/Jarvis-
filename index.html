<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S.</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #030712;
      color: #00f0ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 24px 16px;
      overflow-x: hidden;
    }
    header {
      text-align: center;
      margin-top: 10px;
    }
    h1 {
      letter-spacing: 6px;
      font-size: 1.8rem;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.7);
    }
    .status {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 6px;
      letter-spacing: 1px;
    }
    .reactor-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 40px 0;
    }
    .reactor {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 3px solid rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.35), inset 0 0 30px rgba(0, 240, 255, 0.35);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .reactor-core {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: radial-gradient(circle, #e0ffff 20%, #00f0ff 70%, #030712 100%);
      box-shadow: 0 0 25px #00f0ff;
    }
    .reactor.active {
      transform: scale(1.08);
      border-color: #38bdf8;
      box-shadow: 0 0 60px rgba(56, 189, 248, 0.9), inset 0 0 40px rgba(56, 189, 248, 0.6);
      animation: pulse 1.4s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1.03); opacity: 0.85; }
      100% { transform: scale(1.12); opacity: 1; }
    }
    .terminal {
      width: 100%;
      max-width: 550px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 12px;
      padding: 16px;
      min-height: 120px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #e2e8f0;
      margin-bottom: 20px;
      backdrop-filter: blur(8px);
    }
    .user-text {
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .jarvis-text {
      color: #f8fafc;
    }
    .controls {
      width: 100%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    button {
      padding: 12px 20px;
      background: transparent;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 1px;
    }
    button:hover {
      background: #00f0ff;
      color: #030712;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
    }
    .btn-voice {
      width: 100%;
      font-size: 1rem;
      padding: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>J.A.R.V.I.S.</h1>
    <div class="status" id="status">SECURITY CHECK REQUIRED</div>
  </header>

  <div class="reactor-container">
    <div class="reactor" id="reactor" onclick="toggleListening()">
      <div class="reactor-core"></div>
    </div>
  </div>

  <div class="terminal">
    <div class="user-text" id="userOutput">Type below or tap Voice Link.</div>
    <div class="jarvis-text" id="jarvisOutput">Standing by, Sir.</div>
  </div>

  <div class="controls">
    <button class="btn-voice" id="voiceBtn" onclick="toggleListening()">INITIALIZE VOICE LINK</button>
    <div class="input-row">
      <input type="text" id="textInput" placeholder="Enter command manually..." onkeydown="if(event.key==='Enter') sendManualCommand()">
      <button onclick="sendManualCommand()">SEND</button>
    </div>
  </div>

  <script>
    // ================= CONFIGURATION =================
    const GEMINI_API_KEY = "AQ.Ab8RN6LAKH-gvU7koyUXEP2Di72mJLsfPP5gFSKCeqYbzSNoOQ";
    const SECRET_PIN = "0000"; 
    // =================================================

    const statusEl = document.getElementById("status");
    const reactor = document.getElementById("reactor");
    const userOutput = document.getElementById("userOutput");
    const jarvisOutput = document.getElementById("jarvisOutput");
    const voiceBtn = document.getElementById("voiceBtn");

    let isAuthorized = false;
    let isListening = false;

    function verifyIdentity() {
      const entered = prompt("IDENTITY VERIFICATION REQUIRED.\nEnter Access PIN:");
      if (entered === SECRET_PIN) {
        isAuthorized = true;
        statusEl.innerText = "ONLINE - SYSTEM SECURED";
        speakResponse("Welcome back, Sir. All systems operational.");
      } else {
        alert("Access Denied. Unauthorized entity detected.");
        statusEl.innerText = "ACCESS LOCKED";
      }
    }
    window.onload = verifyIdentity;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = "en-IN";

      recognition.onstart = () => {
        isListening = true;
        reactor.classList.add("active");
        statusEl.innerText = "LISTENING...";
        voiceBtn.innerText = "LISTENING TO COMMAND...";
      };

      recognition.onend = () => {
        isListening = false;
        reactor.classList.remove("active");
        voiceBtn.innerText = "INITIALIZE VOICE LINK";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userOutput.innerText = `You: ${transcript}`;
        processCommand(transcript);
      };

      recognition.onerror = (event) => {
        statusEl.innerText = `Error: ${event.error}`;
        reactor.classList.remove("active");
      };
    } else {
      statusEl.innerText = "Speech Recognition not supported in this view. Open in Chrome.";
    }

    function toggleListening() {
      if (!isAuthorized) {
        verifyIdentity();
        return;
      }
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        window.speechSynthesis.cancel();
        recognition.start();
      }
    }

    function sendManualCommand() {
      if (!isAuthorized) {
        verifyIdentity();
        return;
      }
      const input = document.getElementById("textInput");
      const val = input.value.trim();
      if (!val) return;
      userOutput.innerText = `You: ${val}`;
      input.value = "";
      processCommand(val);
    }

    async function processCommand(promptText) {
      statusEl.innerText = "THINKING...";
      jarvisOutput.innerText = "Processing command...";

      const systemInstruction = "You are J.A.R.V.I.S., an advanced AI assistant. Address the user as 'Sir'. Keep responses concise, highly intelligent, direct, and slightly witty when appropriate. You understand both Hindi and English.";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": GEMINI_API_KEY
          },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `${systemInstruction}\n\nCommand:${promptText}` }] }]
          })
        });

        const data = await response.json();

        if (data.error) {
          jarvisOutput.innerText = `Error: ${data.error.message}`;
          statusEl.innerText = "AUTH ERROR";
          return;
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response received, Sir.";

        jarvisOutput.innerText = reply;
        statusEl.innerText = "ONLINE - SYSTEM SECURED";
        speakResponse(reply);

      } catch (err) {
        jarvisOutput.innerText = `Network Error: ${err.message}`;
        statusEl.innerText = "SYSTEM ERROR";
      }
    }

    function speakResponse(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const cleanText = text.replace(/[*_#`]/g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.rate = 1.05;
      utterance.pitch = 0.95;

      const voices = window.speechSynthesis.getVoices();
      const maleVoice = voices.find(v => v.name.includes("Male") || v.name.includes("David") || v.name.includes("Natural"));
      if (maleVoice) utterance.voice = maleVoice;

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
