<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S.</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #030712;
      color: #00f0ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 20px 16px;
      overflow-x: hidden;
    }
    header {
      text-align: center;
      margin-top: 5px;
    }
    h1 {
      letter-spacing: 6px;
      font-size: 1.8rem;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.7);
    }
    .status {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 6px;
      letter-spacing: 1px;
    }
    .reactor-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 25px 0;
    }
    .reactor {
      width: 155px;
      height: 155px;
      border-radius: 50%;
      border: 3px solid rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.35), inset 0 0 30px rgba(0, 240, 255, 0.35);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .reactor-core {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle, #e0ffff 20%, #00f0ff 70%, #030712 100%);
      box-shadow: 0 0 25px #00f0ff;
    }
    .reactor.active {
      transform: scale(1.08);
      border-color: #38bdf8;
      box-shadow: 0 0 60px rgba(56, 189, 248, 0.9), inset 0 0 40px rgba(56, 189, 248, 0.6);
      animation: pulse 1.4s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1.03); opacity: 0.85; }
      100% { transform: scale(1.12); opacity: 1; }
    }
    .terminal {
      width: 100%;
      max-width: 550px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 12px;
      padding: 16px;
      min-height: 110px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #e2e8f0;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
    }
    .user-text {
      color: #38bdf8;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .jarvis-text {
      color: #f8fafc;
    }
    .controls {
      width: 100%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"], input[type="password"] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    button {
      padding: 12px 18px;
      background: transparent;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 1px;
    }
    button:hover {
      background: #00f0ff;
      color: #030712;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
    }
    .btn-voice {
      width: 100%;
      font-size: 1rem;
      padding: 13px;
    }
    .info-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #94a3b8;
      padding: 0 4px;
    }
    .btn-reset {
      font-size: 0.75rem;
      padding: 4px;
      border: none;
      color: #64748b;
      background: transparent;
      cursor: pointer;
      align-self: center;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 7, 18, 0.94);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-card {
      background: #0f172a;
      border: 1px solid #00f0ff;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #00f0ff;
      text-align: center;
    }
    .modal-desc {
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- AUTH MODAL -->
  <div class="modal-overlay" id="setupModal">
    <div class="modal-card">
      <div class="modal-title" id="modalTitle">SECURITY PROTOCOL</div>
      <div class="modal-desc" id="modalDesc">Enter Access PIN to authorize:</div>
      <input type="password" id="modalPinInput" placeholder="Enter PIN (Default: 0000)">
      <input type="text" id="modalKeyInput" placeholder="Paste Gemini API Key here..." style="display: none;">
      <button id="modalActionBtn" onclick="handleAuthSubmit()">AUTHORIZE</button>
    </div>
  </div>

  <header>
    <h1>J.A.R.V.I.S.</h1>
    <div class="status" id="status">INITIALIZING SYSTEMS...</div>
  </header>

  <div class="reactor-container">
    <div class="reactor" id="reactor" onclick="handleReactorClick()">
      <div class="reactor-core"></div>
    </div>
  </div>

  <div class="terminal">
    <div class="user-text" id="userOutput">Tap core once to activate JARVIS.</div>
    <div class="jarvis-text" id="jarvisOutput">Standing by, Sir.</div>
  </div>

  <div class="controls">
    <button class="btn-voice" id="voiceBtn" onclick="handleReactorClick()">START VOICE PROTOCOL</button>
    
    <div class="info-bar">
      <span>Say "Chup" or "Stop" anytime</span>
      <span style="color: #38bdf8;">Memory: Active</span>
    </div>

    <div class="input-row">
      <input type="text" id="textInput" placeholder="Enter command manually..." onkeydown="if(event.key==='Enter') sendManualCommand()">
      <button onclick="sendManualCommand()">SEND</button>
    </div>
    
    <button class="btn-reset" onclick="resetConfig()">Reset PIN & API Key</button>
  </div>

  <script>
    const SECRET_PIN = "0000";
    let apiKey = localStorage.getItem("jarvis_gemini_key") || "";
    let conversationHistory = [];

    const setupModal = document.getElementById("setupModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalDesc = document.getElementById("modalDesc");
    const modalPinInput = document.getElementById("modalPinInput");
    const modalKeyInput = document.getElementById("modalKeyInput");
    const modalActionBtn = document.getElementById("modalActionBtn");

    const statusEl = document.getElementById("status");
    const reactor = document.getElementById("reactor");
    const userOutput = document.getElementById("userOutput");
    const jarvisOutput = document.getElementById("jarvisOutput");
    const voiceBtn = document.getElementById("voiceBtn");

    let isAuthorized = false;
    let isListening = false;
    let keepListening = true;
    let isSpeaking = false;
    let currentStep = "PIN";

    const STOP_WORDS = ["chup", "stop", "shant", "ruko", "ruk jao", "bas", "wait", "chup ho jao", "quiet"];

    function handleAuthSubmit() {
      if (currentStep === "PIN") {
        if (modalPinInput.value === SECRET_PIN) {
          if (!apiKey) {
            currentStep = "KEY";
            modalTitle.innerText = "GEMINI API CONFIGURATION";
            modalDesc.innerText = "Paste your Gemini API key below:";
            modalPinInput.style.display = "none";
            modalKeyInput.style.display = "block";
            modalActionBtn.innerText = "SAVE & CONNECT";
          } else {
            completeAuth();
          }
        } else {
          alert("Incorrect PIN! Try again.");
          modalPinInput.value = "";
        }
      } else if (currentStep === "KEY") {
        const enteredKey = modalKeyInput.value.trim();
        if (enteredKey) {
          apiKey = enteredKey;
          localStorage.setItem("jarvis_gemini_key", apiKey);
          completeAuth();
        } else {
          alert("Please enter a valid API key.");
        }
      }
    }

    function completeAuth() {
      isAuthorized = true;
      setupModal.style.display = "none";
      statusEl.innerText = "ONLINE - SYSTEM SECURED";
      speakResponse("All systems online, Sir. Main sun raha hoon.");
      setTimeout(() => startMic(), 1500);
    }

    function resetConfig() {
      localStorage.removeItem("jarvis_gemini_key");
      location.reload();
    }

    // Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true; // Fast detection for interruption
      recognition.lang = "en-IN";

      recognition.onstart = () => {
        isListening = true;
        reactor.classList.add("active");
        statusEl.innerText = isSpeaking ? "JARVIS SPEAKING (Say 'Chup' to stop)" : "LISTENING...";
        voiceBtn.innerText = "MIC ACTIVE";
      };

      recognition.onend = () => {
        isListening = false;
        reactor.classList.remove("active");
        if (keepListening && isAuthorized) {
          setTimeout(() => startMic(), 200);
        }
      };

      recognition.onresult = (event) => {
        let interimTranscript = '';
        let finalTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const text = event.results[i][0].transcript.toLowerCase().trim();
          if (event.results[i].isFinal) {
            finalTranscript += text;
          } else {
            interimTranscript += text;
          }
        }

        const currentSpeech = (interimTranscript || finalTranscript).toLowerCase().trim();

        // VOICE INTERRUPTION CHECK: agar JARVIS bol raha hai aur aapne rokne ko bola
        if (isSpeaking) {
          const hasStopWord = STOP_WORDS.some(word => currentSpeech.includes(word));
          if (hasStopWord) {
            window.speechSynthesis.cancel();
            isSpeaking = false;
            statusEl.innerText = "INTERRUPTED - LISTENING...";
            jarvisOutput.innerText = "Sir, bolna band kar diya. Aage bataiye...";
            return;
          }
        }

        // Agar final command mil gaya aur JARVIS nahi bol raha hai
        if (finalTranscript.length > 0 && !isSpeaking) {
          // Check agar akele "chup" bola gaya ho bina JARVIS ke bole
          if (STOP_WORDS.includes(finalTranscript)) {
            jarvisOutput.innerText = "Sir, main bilkul shant hoon.";
            return;
          }
          userOutput.innerText = `You: ${finalTranscript}`;
          handleCommandRouting(finalTranscript);
        }
      };

      recognition.onerror = (event) => {
        if (event.error === "not-allowed") {
          statusEl.innerText = "MIC PERMISSION BLOCKED";
          keepListening = false;
        }
      };
    } else {
      statusEl.innerText = "Speech Recognition not supported. Use Google Chrome.";
    }

    function startMic() {
      if (!recognition || !isAuthorized) return;
      if (!isListening) {
        try { recognition.start(); } catch(e) {}
      }
    }

    function handleReactorClick() {
      if (!isAuthorized) {
        setupModal.style.display = "flex";
        return;
      }
      if (isSpeaking) {
        window.speechSynthesis.cancel();
        isSpeaking = false;
        statusEl.innerText = "SHUT DOWN - LISTENING";
        return;
      }
      keepListening = true;
      startMic();
    }

    function sendManualCommand() {
      if (!isAuthorized) {
        setupModal.style.display = "flex";
        return;
      }
      const input = document.getElementById("textInput");
      const val = input.value.trim();
      if (!val) return;
      userOutput.innerText = `You: ${val}`;
      input.value = "";
      handleCommandRouting(val);
    }

    // Automations
    function handleCommandRouting(cmd) {
      const lower = cmd.toLowerCase().trim();

      if (lower.includes("youtube pe chalao") || lower.startsWith("play") && lower.includes("on youtube")) {
        const query = lower.replace("youtube pe chalao", "").replace("play", "").replace("on youtube", "").trim();
        speakResponse(`Sir, YouTube par ${query || "video"} open kar raha hoon.`);
        window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`, '_blank');
        return;
      }

      if (lower.includes("google pe search karo") || lower.startsWith("search") && lower.includes("on google")) {
        const query = lower.replace("google pe search karo", "").replace("search", "").replace("on google", "").trim();
        speakResponse(`Sir, Google par dhoondh raha hoon.`);
        window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
        return;
      }

      if (lower.includes("time kya") || lower.includes("what time")) {
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        speakResponse(`Sir, abhi time ${timeStr} hua hai.`);
        return;
      }

      processCommand(cmd);
    }

    // Gemini API
    async function processCommand(promptText) {
      statusEl.innerText = "THINKING...";
      jarvisOutput.innerText = "Processing command...";

      conversationHistory.push({
        role: "user",
        parts: [{ text: promptText }]
      });

      if (conversationHistory.length > 10) {
        conversationHistory = conversationHistory.slice(-10);
      }

      const systemInstructionText = "You are J.A.R.V.I.S., Tony Stark's AI assistant. Always speak in natural, sharp, witty Hinglish (Hindi written in English alphabet with natural English phrases). Always address the user as 'Sir'. Keep responses concise (1 to 2 sentences max).";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: systemInstructionText }] },
            contents: conversationHistory
          })
        });

        const data = await response.json();

        if (data.error) {
          jarvisOutput.innerText = `Error: ${data.error.message}`;
          statusEl.innerText = "API ERROR";
          speakResponse("Sir, API connection mein problem aayi hai.");
          return;
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sir, koi response nahi mila.";

        conversationHistory.push({
          role: "model",
          parts: [{ text: reply }]
        });

        jarvisOutput.innerText = reply;
        statusEl.innerText = "ONLINE";
        speakResponse(reply);

      } catch (err) {
        jarvisOutput.innerText = `Network Error: ${err.message}`;
        statusEl.innerText = "SYSTEM ERROR";
      }
    }

    // Text to Speech
    function speakResponse(text) {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();

      const cleanText = text.replace(/[*_#`]/g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.rate = 1.05;
      utterance.pitch = 0.95;

      const voices = window.speechSynthesis.getVoices();
      const indianVoice = voices.find(v => v.lang === "en-IN" || v.lang === "hi-IN" || v.name.includes("India"));
      if (indianVoice) utterance.voice = indianVoice;

      utterance.onstart = () => {
        isSpeaking = true;
        statusEl.innerText = "JARVIS SPEAKING (Say 'Chup' to stop)";
      };

      utterance.onend = () => {
        isSpeaking = false;
        statusEl.innerText = "LISTENING...";
      };

      utterance.onerror = () => {
        isSpeaking = false;
        statusEl.innerText = "LISTENING...";
      };

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
